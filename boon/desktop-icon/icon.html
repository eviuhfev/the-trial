<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: drag;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .mark {
    width: 46px; height: 46px;
    border-radius: 11px;
    transform: rotate(45deg) scale(1);
    background: linear-gradient(135deg, #7aa7ff, #5b8cf5);
    box-shadow: 0 0 22px rgba(91, 140, 245, .55), 0 4px 14px rgba(0, 0, 0, .35);
    transition: transform .12s ease-out;
    animation: breathe 3.2s ease-in-out infinite;
  }
  body:active .mark { transform: rotate(45deg) scale(.82); transition: transform .08s ease-out; }
  @keyframes breathe {
    0%, 100% { transform: rotate(45deg) scale(1); }
    50% { transform: rotate(45deg) scale(1.08); }
  }
</style>
</head>
<body>
  <div class="wrap"><div class="mark"></div></div>
  <script>
    document.body.addEventListener("click", () => window.boonIcon.clicked());
    document.body.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      window.boonIcon.rightClicked();
    });
  </script>
</body>
</html>
