<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Trial</title>
    <meta name="description" content="Four studies that teach the placebo effect by making you design them." />
    <style>
:root {
  --bg: #080b11;
  --panel: #0e131b;
  --panel-edge: #1c2430;
  --ink: #dbe3ee;
  --ink-dim: #94a3b6;
  --ink-faint: #66748a;

  --accent: #5fd0a8;        /* the remedy */
  --placebo: #f0b44b;       /* the dummy pill */
  --nothing: #7f9ec4;       /* no treatment */
  --bad: #ff8a5c;

  --machine: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --human: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --step-0: 15px;
  --step-1: 16px;
  --step-2: 19px;
  --step-3: 27px;
  --label: 11px;
  --measure: 62ch;

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: var(--step-0)/1.6 var(--human);
  -webkit-font-smoothing: antialiased;
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* --- shell -------------------------------------------------------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: rgba(8, 11, 17, 0.93);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--panel-edge);
  font-family: var(--machine);
  font-size: var(--label);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.brand { font-weight: 600; }
.step-label { color: var(--ink-faint); margin-right: auto; font-variant-numeric: tabular-nums; }
.motion-toggle { display: flex; align-items: center; gap: 7px; color: var(--ink-dim); cursor: pointer; }
.motion-toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 30px 30px 26px;
}

.eyebrow {
  margin: 0 0 10px;
  font-family: var(--machine);
  font-size: var(--label);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}

.panel-title { margin: 0 0 12px; font-size: var(--step-3); line-height: 1.25; font-weight: 600; text-wrap: balance; }
.lede { margin: 0 0 22px; color: var(--ink-dim); font-size: var(--step-1); max-width: var(--measure); }
.panel-body > :first-child { margin-top: 0; }
.panel-body p { margin: 0 0 15px; max-width: var(--measure); }

.panel-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid var(--panel-edge);
}

.rule { height: 1px; background: var(--panel-edge); margin: 26px 0; }
.muted { color: var(--ink-faint); font-size: 13.5px; }
.mono { font-family: var(--machine); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.beat-title { font-size: var(--step-2); font-weight: 600; margin: 0 0 14px; text-wrap: balance; }

/* --- buttons ------------------------------------------------------------ */

.btn {
  font: 600 14px/1.35 var(--human);
  padding: 12px 20px;
  border-radius: 7px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #05090d;
  cursor: pointer;
  text-align: left;
  transition: filter 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:disabled { opacity: 0.32; cursor: not-allowed; }
.btn-quiet { background: transparent; border-color: var(--panel-edge); color: var(--ink); }
.btn-quiet:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); filter: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- the question ------------------------------------------------------- */

.question-box {
  border-left: 2px solid var(--accent);
  background: rgba(95, 208, 168, 0.05);
  border-radius: 0 8px 8px 0;
  padding: 14px 18px;
  margin: 0 0 22px;
}
.question-label {
  margin: 0 0 5px;
  font-family: var(--machine);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.the-question { margin: 0; font-size: var(--step-2); font-weight: 600; max-width: var(--measure); }
.question-intro {
  margin: 0 0 10px;
  font-family: var(--machine);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* --- designing the study ------------------------------------------------ */

.design { display: flex; flex-direction: column; gap: 9px; margin: 0 0 24px; }

.tool {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 13px 15px;
  border: 1px solid var(--panel-edge);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.tool:hover { border-color: var(--ink-faint); }
.tool.on { border-color: var(--accent); background: rgba(95, 208, 168, 0.05); }
.tool.locked { cursor: default; opacity: 0.75; }
.tool input { accent-color: var(--accent); margin-top: 3px; }
.tool-fixed { color: var(--accent); font-size: 13px; margin-top: 1px; }
.tool strong { display: block; font-weight: 600; font-size: 14.5px; }
.tool-help { display: block; color: var(--ink-faint); font-size: 13px; margin-top: 2px; }

/* --- results ------------------------------------------------------------ */

.results { display: flex; flex-direction: column; gap: 20px; margin: 0 0 22px; }

.arm { border-left: 2px solid var(--arm, var(--accent)); padding-left: 14px; }
.arm-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
.arm-name { font-weight: 600; color: var(--arm, var(--accent)); }
.arm-count {
  font-family: var(--machine);
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.arm-rate {
  display: block;
  margin-top: 7px;
  font-family: var(--machine);
  font-size: 21px;
  color: var(--arm, var(--accent));
  font-variant-numeric: tabular-nums;
}

.dots { display: flex; flex-wrap: wrap; gap: 5px; max-width: 520px; }
.dot {
  width: 15px;
  height: 15px;
  border-radius: 4px;
  background: #151c26;
  border: 1px solid #1f2937;
  transition: background 0.18s ease, border-color 0.18s ease;
}
.dot.better { background: var(--arm, var(--accent)); border-color: var(--arm, var(--accent)); }
.dot.same { background: #10161f; border-color: #263140; }

.bar { height: 16px; background: #131a24; border-radius: 4px; overflow: hidden; max-width: 520px; }
.bar-fill { height: 100%; background: var(--arm, var(--accent)); transition: width 0.12s linear; }

.comparisons { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.comparisons li {
  display: grid;
  grid-template-columns: minmax(150px, auto) auto;
  gap: 2px 14px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--panel-edge);
}
.cmp-label { font-weight: 600; font-size: 14px; }
.cmp-value { font-family: var(--machine); font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
.cmp-ci { grid-column: 1 / -1; color: var(--ink-faint); font-size: 12.5px; }

.verdicts { display: flex; flex-direction: column; gap: 9px; width: 100%; }
.verdicts .btn { width: 100%; }

/* --- lessons ------------------------------------------------------------ */

.callout {
  border-left: 3px solid var(--bad);
  background: rgba(255, 138, 92, 0.06);
  padding: 14px 18px;
  border-radius: 0 8px 8px 0;
  margin: 0 0 18px;
}
.callout.good { border-left-color: var(--accent); background: rgba(95, 208, 168, 0.06); }
.callout p { margin: 0; max-width: var(--measure); }

.lesson-term {
  border-top: 1px solid var(--panel-edge);
  padding-top: 14px;
  color: var(--ink-dim);
  font-size: 14.5px;
}

.termstrip { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.term {
  border: 1px solid var(--panel-edge);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: var(--machine);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* --- the answer --------------------------------------------------------- */

.decomp { margin: 0 0 22px; }
.decomp-bar { display: flex; height: 44px; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--machine);
  font-size: 13px;
  color: #05090d;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.seg-natural { background: var(--nothing); }
.seg-placebo { background: var(--placebo); }
.seg-remedy { background: var(--accent); }

.decomp-key { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.decomp-key li { color: var(--ink-dim); max-width: var(--measure); padding-left: 22px; position: relative; font-size: 14.5px; }
.decomp-key strong { color: var(--ink); }
.key { position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 3px; }
.key-natural { background: var(--nothing); }
.key-placebo { background: var(--placebo); }
.key-remedy { background: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 0 0 20px; }
.stat { display: flex; flex-direction: column; gap: 3px; padding: 14px; border: 1px solid var(--panel-edge); border-radius: 8px; }
.stat-value { font-family: var(--machine); font-size: 21px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
.stat-note { font-size: 11.5px; color: var(--ink-faint); }

.scorelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.scorelist li { display: flex; gap: 11px; color: var(--ink-dim); font-size: 14.5px; max-width: var(--measure); }
.scorelist li.ok .score-mark { color: var(--accent); }
.score-mark { font-family: var(--machine); color: var(--ink-faint); width: 12px; flex: none; }

/* --- the field guide ---------------------------------------------------- */

.glossary { display: flex; flex-direction: column; gap: 14px; }
.glossary-lede p { max-width: var(--measure); margin: 0 0 10px; }

.bias {
  border: 1px solid var(--panel-edge);
  border-left: 2px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 16px 18px;
}
.bias-term {
  margin: 0 0 6px;
  font-family: var(--machine);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}
.bias-definition { margin: 0 0 12px; max-width: var(--measure); font-size: var(--step-1); }
.bias-line { margin: 0 0 10px; max-width: var(--measure); color: var(--ink-dim); font-size: 14px; }
.bias-line:last-child { margin-bottom: 0; }
.bias-tag {
  display: block;
  margin-bottom: 3px;
  font-family: var(--machine);
  font-size: var(--label);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.bias-examples { margin: 0; padding-left: 18px; }
.bias-examples li { margin-bottom: 5px; }
.bias-examples li:last-child { margin-bottom: 0; }

/* --- data --------------------------------------------------------------- */

.terms { margin: 0 0 18px; padding-left: 20px; }
.terms li { margin-bottom: 12px; color: var(--ink-dim); }
.terms strong { color: var(--ink); }
.terms-tight li { margin-bottom: 7px; font-size: 14px; }

.disclosure { border: 1px solid var(--panel-edge); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.disclosure summary {
  cursor: pointer;
  font-family: var(--machine);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.disclosure[open] summary { margin-bottom: 12px; }

.data-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.data-status { min-height: 22px; font-size: 13.5px; color: var(--accent); }
.raw-record { font-family: var(--machine); font-size: 11.5px; }

textarea {
  width: 100%;
  background: #0a0e15;
  color: var(--ink);
  border: 1px solid var(--panel-edge);
  border-radius: 7px;
  padding: 11px 13px;
  font: 14px/1.5 var(--human);
  resize: vertical;
}

@media (max-width: 620px) {
  .panel { padding: 22px 18px 20px; }
  .panel-title { font-size: 23px; }
  main { padding: 20px 12px 60px; }
  .dot { width: 13px; height: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* --- the closing summary ------------------------------------------------- */

.summary {
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 24px 26px;
  background: rgba(95, 208, 168, 0.05);
}
.summary-head {
  margin: 0 0 14px;
  font-family: var(--machine);
  font-size: var(--label);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.summary p { max-width: var(--measure); margin: 0 0 14px; }
.summary-lede { font-size: var(--step-1); }
.summary-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.summary-list li { max-width: var(--measure); color: var(--ink-dim); font-size: 14.5px; }
.sum-term {
  color: var(--accent);
  font-family: var(--machine);
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.summary-close { border-top: 1px solid var(--panel-edge); padding-top: 15px; margin-bottom: 0 !important; color: var(--ink-dim); font-size: 14.5px; }

    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">THE TRIAL</span>
      <span id="step-label" class="step-label">1 / 7</span>
      <label class="motion-toggle" for="motion-toggle">
        <input type="checkbox" id="motion-toggle" />
        <span>Reduce motion</span>
      </label>
    </header>
    <main id="app"></main>
    <div id="live-region" class="visually-hidden" aria-live="polite" role="status"></div>
    <script>
'use strict';
(function () {
/* ---- src/rng.js ---- */
// Deterministic pseudo-randomness. Every run of the challenge must be
// reconstructable from a seed string alone, so nothing here may touch
// Math.random or the clock.

function fnv1a(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hashHex(str) {
  return fnv1a(str).toString(16).padStart(8, '0');
}

function mulberry32(a) {
  return function next() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(seedString) {
  return mulberry32(fnv1a(seedString));
}

// Only used to pick a fresh session seed, never inside the simulation.
function randomSeedString() {
  const c = globalThis.crypto;
  if (c && typeof c.getRandomValues === 'function') {
    const v = new Uint32Array(2);
    c.getRandomValues(v);
    return v[0].toString(36) + '-' + v[1].toString(36);
  }
  return Math.random().toString(36).slice(2, 10);
}

/* ---- src/trial.js ---- */
// The model behind the game: what is actually true of the remedy, and what a
// given study design is able to see of it.
//
// Nothing here is hidden from the player forever. The debrief prints these
// numbers in full, so the game can be checked rather than believed.


// The ground truth. The player never sees these until the end; every result in
// the game is sampled from them.
const TRUTH = Object.freeze({
  // Headaches like these mostly pass on their own.
  natural: 0.4,
  // With a dummy pill they believe in, more people report improvement. The gap
  // between this and `natural` is the placebo effect: 20 points.
  placebo: 0.6,
  // With the real remedy. The gap between this and `placebo` is what the drug
  // itself adds: 10 points.
  remedy: 0.7,
  // An assessor who knows who got what marks the treated group generously.
  observerBias: 0.1,
});

const ARMS = {
  remedy: { id: 'remedy', label: 'The remedy', short: 'remedy', colour: '#5fd0a8' },
  placebo: { id: 'placebo', label: 'A dummy pill', short: 'dummy pill', colour: '#f0b44b' },
  nothing: { id: 'nothing', label: 'Nothing at all', short: 'nothing', colour: '#7f9ec4' },
};

const GROUP_SIZES = [20, 600];

function armsInDesign(design) {
  const arms = ['remedy'];
  if (design.placebo) arms.push('placebo');
  if (design.nothing) arms.push('nothing');
  return arms;
}

// The rate an assessor will *record* for an arm, which is the true rate plus
// whatever their expectations add when they know who got what.
function observedRate(armId, blinded) {
  const base = TRUTH[armId === 'nothing' ? 'natural' : armId];
  if (blinded || armId !== 'remedy') return base;
  return Math.min(0.98, base + TRUTH.observerBias);
}

function runStudy(seed, design) {
  const rnd = makeRng(seed + ':' + JSON.stringify(design));
  const arms = armsInDesign(design).map((id) => {
    const rate = observedRate(id, design.blinded);
    const patients = [];
    let better = 0;
    for (let i = 0; i < design.n; i++) {
      const improved = rnd() < rate;
      patients.push(improved);
      if (improved) better++;
    }
    return {
      id,
      label: ARMS[id].label,
      colour: ARMS[id].colour,
      n: design.n,
      better,
      patients,
      rate: Math.round((better / design.n) * 1000) / 1000,
    };
  });
  return { design: { ...design }, arms };
}

function arm(study, id) {
  return study.arms.find((a) => a.id === id) || null;
}

// A rough 95% interval for the difference between two arms. The point of
// showing it is not the arithmetic - it is that with small groups the interval
// is wide enough to contain nothing at all.
function difference(study, aId, bId) {
  const a = arm(study, aId);
  const b = arm(study, bId);
  if (!a || !b) return null;
  const pa = a.better / a.n;
  const pb = b.better / b.n;
  const diff = pa - pb;
  const se = Math.sqrt((pa * (1 - pa)) / a.n + (pb * (1 - pb)) / b.n);
  const margin = 1.96 * se;
  const pct = (v) => Math.round(v * 100);
  return {
    from: bId,
    to: aId,
    points: pct(diff),
    low: pct(diff - margin),
    high: pct(diff + margin),
    // If the interval straddles zero, this study cannot rule out "no difference".
    couldBeNothing: diff - margin <= 0 && diff + margin >= 0,
  };
}

const VERDICTS = ['works', 'nothing', 'cant-tell'];

// What a given design is actually able to conclude about the remedy's own
// effect - beyond what a dummy pill would do.
function assess(design) {
  if (!design.placebo) {
    return {
      correct: 'cant-tell',
      because: design.nothing
        ? 'Your treated group knew they were being treated. Expectation, ritual and attention could account for the whole gap, and nothing in this design separates them from the remedy.'
        : 'You have nothing to compare against. Most of these headaches pass on their own, so improvement on its own tells you nothing.',
      missing: design.nothing ? 'a dummy-pill group' : 'any comparison group',
    };
  }
  if (!design.blinded) {
    return {
      correct: 'cant-tell',
      because: 'You knew who got the real remedy while you were judging whether they improved, and that shows in the numbers. The comparison is sound; the marking is not.',
      missing: 'blinding',
    };
  }
  if (design.n < 200) {
    return {
      correct: 'cant-tell',
      because: 'The design is right, but the groups are too small. The difference you are looking for is smaller than the wobble you get from chance alone with this many people.',
      missing: 'enough patients',
    };
  }
  return {
    correct: 'works',
    because: 'Placebo-controlled, blinded, and large enough for the difference to stand clear of chance. This design can answer the question.',
    missing: null,
  };
}

/* ---- src/rounds.js ---- */
// Four rounds. Each one hands you a tool the last round proved you needed, and
// asks the same question again.
//
// The question never changes, because that is the point: you are not learning
// four facts, you are learning what it takes to answer one.

const QUESTION = 'Does the remedy do anything that a dummy pill would not?';

const ROUNDS = [
  {
    n: 1,
    title: 'Twenty patients',
    brief: 'A colleague brings you a remedy and twenty patients with a headache.',
    unlocks: null,
    terms: ['no control group', 'natural recovery'],
    lesson: {
      heading: 'Most headaches go away on their own',
      body:
        'About four in ten would have recovered within the hour whatever you gave them. Improvement after a treatment is not evidence that the treatment did it. You need a control group.',
    },
  },
  {
    n: 2,
    title: 'A group that gets nothing',
    brief: 'You run it again. Half the patients get nothing at all.',
    unlocks: 'nothing',
    terms: ['expectation', 'placebo response', 'confounding'],
    lesson: {
      heading: 'Your treated patients knew they were being treated',
      body:
        'A doctor handed them a pill and said it works. Expectation travelled with the remedy, so your gap holds both — that mixture is the placebo response. The comparison group needs a treatment too, with nothing in it.',
    },
  },
  {
    n: 3,
    title: 'An identical pill with nothing in it',
    brief: 'The pharmacy makes a dummy pill: same size, same colour, no ingredient.',
    unlocks: 'placebo',
    terms: ['placebo effect', 'placebo-controlled', 'observer bias'],
    lesson: {
      heading: 'There is the placebo effect — and a problem',
      body:
        'The gap between nothing and the dummy pill is the placebo effect: real improvement produced by expecting treatment. But you knew who had the real remedy while judging them. That is observer bias; blinding is the fix.',
    },
  },
  {
    n: 4,
    title: 'Nobody knows who got what',
    brief: 'The bottles come back numbered, and you can afford far more patients.',
    unlocks: 'blinded',
    terms: ['double-blind', 'randomised controlled trial', 'sample size'],
    lesson: {
      heading: 'This is a randomised, double-blind, placebo-controlled trial',
      body:
        'Every piece was forced on you by a question the last design could not answer: what happens anyway, expectation versus ingredient, your own hopes marking the results, and chance.',
    },
  },
];

function roundByNumber(n) {
  const round = ROUNDS.find((r) => r.n === n);
  if (!round) throw new Error('no such round: ' + n);
  return round;
}

// What the player is allowed to switch on by the time they reach a round.
function toolsAvailable(roundNumber) {
  return {
    nothing: roundNumber >= 2,
    placebo: roundNumber >= 3,
    blinded: roundNumber >= 4,
    size: roundNumber >= 4,
  };
}

// The design a round starts you with: everything you have unlocked, switched
// on. You may switch things off, and the game will let you.
function defaultDesign(roundNumber) {
  const tools = toolsAvailable(roundNumber);
  return {
    nothing: tools.nothing,
    placebo: tools.placebo,
    blinded: tools.blinded,
    n: tools.size ? 600 : 20,
  };
}

// Small DOM helpers. No framework, no dependencies.

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

let uid = 0;
const nextId = (p) => p + '-' + ++uid;

// A 0-100 rating that starts genuinely unanswered. The player has to move it
// before the page will continue, so the midpoint is never recorded as a reply
// nobody gave.
function rating({ label, help, minLabel, maxLabel, onTouch }) {
  const id = nextId('rating');
  const input = el('input', {
    type: 'range',
    min: '0',
    max: '100',
    step: '1',
    value: '50',
    id,
    class: 'rating-input untouched',
    'aria-describedby': id + '-out',
  });
  const out = el('output', { class: 'rating-value', id: id + '-out', text: 'not answered' });
  let touched = false;
  const mark = () => {
    if (!touched) {
      touched = true;
      input.classList.remove('untouched');
      if (onTouch) onTouch();
    }
    out.textContent = input.value;
  };
  input.addEventListener('input', mark);
  input.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) mark();
  });
  const node = el(
    'div',
    { class: 'question' },
    el('label', { class: 'question-label', for: id, text: label }),
    help ? el('p', { class: 'question-help', text: help }) : null,
    input,
    el(
      'div',
      { class: 'rating-scale' },
      el('span', { text: minLabel }),
      out,
      el('span', { text: maxLabel }),
    ),
  );
  return {
    node,
    get value() {
      return touched ? Number(input.value) : null;
    },
    get answered() {
      return touched;
    },
  };
}

function choice({ label, help, options, onTouch }) {
  const name = nextId('choice');
  let value = null;
  const inputs = options.map((opt) => {
    const id = nextId('opt');
    const input = el('input', { type: 'radio', name, id, value: opt.value });
    input.addEventListener('change', () => {
      value = opt.value;
      if (onTouch) onTouch();
    });
    return el('label', { class: 'choice-option', for: id }, input, el('span', { text: opt.label }));
  });
  const node = el(
    'fieldset',
    { class: 'question' },
    el('legend', { class: 'question-label', text: label }),
    help ? el('p', { class: 'question-help', text: help }) : null,
    el('div', { class: 'choice-options' }, inputs),
  );
  return {
    node,
    get value() {
      return value;
    },
    get answered() {
      return value !== null;
    },
  };
}

function freeText({ label, help, placeholder }) {
  const id = nextId('text');
  const area = el('textarea', { id, rows: '3', placeholder: placeholder || '' });
  const node = el(
    'div',
    { class: 'question' },
    el('label', { class: 'question-label', for: id, text: label }),
    help ? el('p', { class: 'question-help', text: help }) : null,
    area,
  );
  return {
    node,
    get value() {
      return area.value.trim() || null;
    },
    get answered() {
      return true;
    },
  };
}

// Binds a continue button to a set of questions: it stays disabled until every
// required one has actually been answered.
function gate(button, questions) {
  const check = () => {
    button.disabled = !questions.every((q) => q.answered);
  };
  check();
  return check;
}

function panel({ eyebrow, title, lede, children, footer }) {
  return el(
    'section',
    { class: 'panel' },
    eyebrow ? el('p', { class: 'eyebrow', text: eyebrow }) : null,
    title ? el('h1', { class: 'panel-title', text: title }) : null,
    lede ? el('p', { class: 'lede', text: lede }) : null,
    el('div', { class: 'panel-body' }, children || []),
    footer ? el('div', { class: 'panel-footer' }, footer) : null,
  );
}

function button(text, onClick, opts = {}) {
  return el('button', {
    class: 'btn' + (opts.variant ? ' btn-' + opts.variant : ''),
    type: 'button',
    text,
    onclick: onClick,
    disabled: opts.disabled,
  });
}

function stat(label, value, note) {
  return el(
    'div',
    { class: 'stat' },
    el('span', { class: 'stat-value', text: value }),
    el('span', { class: 'stat-label', text: label }),
    note ? el('span', { class: 'stat-note', text: note }) : null,
  );
}

function announce(message) {
  const live = document.getElementById('live-region');
  if (live) live.textContent = message;
}

// Everything the session records. Nothing here sends anything anywhere: this
// build has no server and no analytics. The player chooses at the end whether
// the record is kept in this browser, downloaded, or discarded.



const BUILD = { name: 'The Trial', version: '0.1.0' };
const CONSENT_VERSION = '2026-08-31.a';
const STORAGE_KEY = 'the-trial.session.v1';

// A fingerprint of the numbers every result in the game was generated from, so
// the debrief's claim about them can be checked rather than believed.
function truthHash() {
  return hashHex(Object.keys(TRUTH).sort().map((k) => k + '=' + TRUTH[k]).join(';'));
}

function createSession(seed) {
  return {
    schemaVersion: 1,
    participantId: 'p-' + hashHex(seed + ':' + Date.now()),
    consentVersion: CONSENT_VERSION,
    build: { ...BUILD },
    truth: truthHash(),
    startedAt: new Date().toISOString(),
    seed,
    rounds: [],
    device: {
      inputDevice: 'unknown',
      reducedMotion: false,
      viewport: null,
      userAgentFamily: null,
    },
    answers: {},
    runs: [],
    events: [],
    disposition: null,
  };
}

function log(session, type, payload = {}) {
  session.events.push({ t: Date.now() - Date.parse(session.startedAt), type, ...payload });
  return session;
}

function describeDevice() {
  const ua = navigator.userAgent || '';
  const family = /Firefox/.test(ua)
    ? 'firefox'
    : /Edg/.test(ua)
      ? 'edge'
      : /Chrome/.test(ua)
        ? 'chromium'
        : /Safari/.test(ua)
          ? 'safari'
          : 'other';
  return {
    userAgentFamily: family,
    viewport: window.innerWidth + 'x' + window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    touch: navigator.maxTouchPoints > 0,
  };
}

function toJSON(session) {
  return JSON.stringify(session, null, 2);
}

// Saving a file works differently depending on where the page is running, and
// the difference is not cosmetic: a hosted viewer blocks a page from starting
// its own download, so the plain blob link is silently inert there. A build
// whose subject is controls that do not do what they claim cannot ship a dead
// button, so the page asks which route it has before offering one.
//
//   'blob' - an ordinary browser or a local file; the anchor works
//   'host' - a hosted viewer that mediates saves; ask it to save
//   'none' - a hosted viewer with no save route; hide the affordance
async function downloadRoute() {
  const host = globalThis.claude;
  if (!host || typeof host.use !== 'function') return { kind: 'blob' };
  try {
    const downloads = await host.use('downloads');
    return downloads ? { kind: 'host', downloads } : { kind: 'none' };
  } catch {
    return { kind: 'none' };
  }
}

async function downloadSession(session, route) {
  const filename = 'the-trial-' + session.participantId + '.json';
  const json = toJSON(session);
  const via = route || (await downloadRoute());

  if (via.kind === 'host') {
    try {
      await via.downloads.save({ filename, data: json });
      return { saved: true };
    } catch (err) {
      return { saved: false, code: (err && err.code) || 'unavailable' };
    }
  }
  if (via.kind === 'none') return { saved: false, code: 'unavailable' };

  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return { saved: true };
}

function safeStorage() {
  try {
    const s = window.localStorage;
    s.setItem('__probe', '1');
    s.removeItem('__probe');
    return s;
  } catch {
    return null;
  }
}

function keepSession(session) {
  const store = safeStorage();
  if (!store) return false;
  try {
    store.setItem(STORAGE_KEY, toJSON(session));
    return true;
  } catch {
    return false;
  }
}

function storedSession() {
  const store = safeStorage();
  if (!store) return null;
  try {
    const raw = store.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function forgetSession() {
  const store = safeStorage();
  if (!store) return false;
  try {
    store.removeItem(STORAGE_KEY);
    return true;
  } catch {
    return false;
  }
}

/* ---- src/study.js ---- */
// One round: design the study, watch it run, commit to a verdict, find out what
// your design could and could not tell you.




const REVEAL_MS = 650;
const DOT_LIMIT = 50; // above this, counting dots stops being possible

const VERDICT_LABELS = {
  works: 'Yes — the remedy does something',
  nothing: 'No — the remedy does nothing',
  'cant-tell': 'I cannot tell from this study',
};

function roundScreen({ mount, round, seed, reducedMotion, onDone }) {
  const tools = toolsAvailable(round.n);
  const design = defaultDesign(round.n);
  let study = null;
  let verdict = null;

  // --- design ---------------------------------------------------------------

  function toggle(key, label, help) {
    const id = 'tool-' + key + '-' + round.n;
    const input = el('input', { type: 'checkbox', id });
    input.checked = design[key];
    input.addEventListener('change', () => {
      design[key] = input.checked;
      renderDesign();
    });
    return el('label', { class: 'tool' + (design[key] ? ' on' : ''), for: id },
      input,
      el('span', {}, el('strong', { text: label }), el('span', { class: 'tool-help', text: help })));
  }

  const designBox = el('div', { class: 'design' });

  function renderDesign() {
    const rows = [
      el('div', { class: 'tool locked on' },
        el('span', { class: 'tool-fixed', text: '✓' }),
        el('span', {}, el('strong', { text: 'Give the remedy to a group of patients' }),
          el('span', { class: 'tool-help', text: 'Always. This is the thing being tested.' }))),
    ];
    if (tools.nothing) rows.push(toggle('nothing', 'Add a group that gets nothing', 'Something to compare against.'));
    if (tools.placebo) rows.push(toggle('placebo', 'Add a group that gets a dummy pill', 'Identical in every way except the ingredient.'));
    if (tools.blinded) rows.push(toggle('blinded', 'Hide who got what, from everyone', 'Including you, until the study ends.'));
    if (tools.size) {
      const id = 'size-' + round.n;
      const input = el('input', { type: 'checkbox', id });
      input.checked = design.n > 20;
      input.addEventListener('change', () => {
        design.n = input.checked ? 600 : 20;
        renderDesign();
      });
      rows.push(el('label', { class: 'tool' + (design.n > 20 ? ' on' : ''), for: id },
        input,
        el('span', {}, el('strong', { text: '600 patients per group instead of 20' }),
          el('span', { class: 'tool-help', text: 'Enough that a small difference stops looking like luck.' }))));
    }
    designBox.replaceChildren(...rows);
  }

  const runBtn = button('Run the study', () => run());

  const node = panel({
    eyebrow: 'Round ' + round.n + ' of 4',
    title: round.title,
    lede: round.brief,
    children: [
      el('div', { class: 'termstrip' }, round.terms.map((t) => el('span', { class: 'term', text: t }))),
      el('p', { class: 'question-intro', text: 'Your design' }),
      designBox,
      el('div', { class: 'question-box' },
        el('p', { class: 'question-label', text: 'The question, every round:' }),
        el('p', { class: 'the-question', text: QUESTION })),
    ],
    footer: runBtn,
  });
  renderDesign();
  mount.replaceChildren(node);
  runBtn.focus();

  // --- running --------------------------------------------------------------

  function armBlock(armData, progress) {
    const shown = Math.round(armData.n * progress);
    const better = armData.patients.slice(0, shown).filter(Boolean).length;
    const head = el('div', { class: 'arm-head' },
      el('span', { class: 'arm-name', text: armData.label }),
      el('span', { class: 'arm-count', text: better + ' of ' + shown + ' better' }));
    const body = armData.n <= DOT_LIMIT
      ? el('div', { class: 'dots' },
          armData.patients.map((improved, i) =>
            el('span', {
              class: 'dot' + (i < shown ? (improved ? ' better' : ' same') : ''),
            })))
      : el('div', { class: 'bar' },
          el('div', { class: 'bar-fill', style: 'width:' + (shown ? (better / shown) * 100 : 0) + '%' }));
    const pct = shown ? Math.round((better / shown) * 100) : 0;
    const block = el('div', { class: 'arm' }, head, body,
      el('span', { class: 'arm-rate', text: pct + '%' }));
    block.style.setProperty('--arm', armData.colour);
    return block;
  }

  function run() {
    study = runStudy(seed + ':r' + round.n, design);
    const results = el('div', { class: 'results' });
    const node2 = panel({
      eyebrow: 'Round ' + round.n + ' of 4',
      title: 'Running the study',
      lede: describeDesign(design),
      children: [results],
    });
    mount.replaceChildren(node2);
    announce('Running the study.');

    const start = performance.now();
    const paint = (progress) => {
      results.replaceChildren(...study.arms.map((a) => armBlock(a, progress)));
    };
    if (reducedMotion) {
      paint(1);
      askVerdict();
      return;
    }
    const frame = (now) => {
      const p = Math.min(1, (now - start) / REVEAL_MS);
      paint(p);
      if (p < 1) requestAnimationFrame(frame);
      else askVerdict();
    };
    requestAnimationFrame(frame);
  }

  // --- verdict --------------------------------------------------------------

  function comparisons() {
    const rows = [];
    const vsPlacebo = difference(study, 'remedy', 'placebo');
    const vsNothing = difference(study, 'placebo', 'nothing');
    const remedyVsNothing = difference(study, 'remedy', 'nothing');
    const line = (label, d) =>
      d
        ? el('li', {},
            el('span', { class: 'cmp-label', text: label }),
            el('span', { class: 'cmp-value', text: (d.points > 0 ? '+' : '') + d.points + ' points' }),
            el('span', { class: 'cmp-ci', text: 'chance alone could put it anywhere from ' + d.low + ' to ' + d.high }))
        : null;
    rows.push(line('Remedy vs dummy pill', vsPlacebo));
    rows.push(line('Dummy pill vs nothing', vsNothing));
    if (!vsPlacebo) rows.push(line('Remedy vs nothing', remedyVsNothing));
    return el('ul', { class: 'comparisons' }, rows.filter(Boolean));
  }

  function askVerdict() {
    const results = el('div', { class: 'results' },
      ...study.arms.map((a) => armBlock(a, 1)));
    const buttons = Object.keys(VERDICT_LABELS).map((key) =>
      button(VERDICT_LABELS[key], () => judge(key), { variant: 'quiet' }));
    const node3 = panel({
      eyebrow: 'Round ' + round.n + ' · your call',
      title: QUESTION,
      children: [
        results,
        comparisons(),
        el('p', { class: 'muted', text: describeDesign(design) }),
      ],
      footer: el('div', { class: 'verdicts' }, buttons),
    });
    mount.replaceChildren(node3);
    announce('Results in. What is your verdict?');
    buttons[0].focus();
  }

  // --- what the design could actually support -------------------------------

  function judge(chosen) {
    verdict = chosen;
    const judgement = assess(design);
    const vsPlacebo = difference(study, 'remedy', 'placebo');
    // If the design is sound but this particular sample came out ambiguous,
    // holding back is just as defensible as calling it.
    const accepted = judgement.correct === 'works' && vsPlacebo && vsPlacebo.couldBeNothing
      ? ['works', 'cant-tell']
      : [judgement.correct];
    const right = accepted.includes(chosen);

    const go = button(round.n < 4 ? 'Next round' : 'See the whole picture', () =>
      onDone({ round: round.n, design: { ...design }, verdict: chosen, right, correct: judgement.correct }));

    const node4 = panel({
      eyebrow: 'Round ' + round.n + ' · ' + (right ? 'Well judged' : 'Not yet'),
      title: round.lesson.heading,
      children: [
        el('div', { class: 'termstrip' }, round.terms.map((t) => el('span', { class: 'term', text: t }))),
        el('div', { class: right ? 'callout good' : 'callout' },
          el('p', {}, el('strong', { text: right ? 'You were right to say that. ' : 'The honest answer was “' + VERDICT_LABELS[judgement.correct].toLowerCase() + '”. ' }),
            judgement.because)),
        el('p', {}, round.lesson.body),
      ],
      footer: go,
    });
    mount.replaceChildren(node4);
    announce(right ? 'Well judged.' : 'Not quite.');
    go.focus();
  }
}

function describeDesign(design) {
  const bits = ['the remedy'];
  if (design.placebo) bits.push('a dummy pill');
  if (design.nothing) bits.push('nothing at all');
  const arms = bits.length === 1 ? bits[0] : bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1];
  return design.n + ' patients per group, given ' + arms +
    (design.blinded ? ', with nobody knowing who got which.' : ', and you knew who got what.');
}

// The framing screens: what this is, and what the whole thing added up to.





function introScreen({ mount, onDone }) {
  const go = button('Take the first twenty patients', () => onDone());
  const node = panel({
    eyebrow: 'The Trial',

    children: [
      el('div', { class: 'question-box' },
        el('p', { class: 'question-label', text: 'The question, every round:' }),
        el('p', { class: 'the-question', text: QUESTION })),

    ],

// The stacked bar that the whole game exists to earn: what the 70% was made of.
function decomposition() {
  const natural = Math.round(TRUTH.natural * 100);
  const placeboGap = Math.round((TRUTH.placebo - TRUTH.natural) * 100);
  const remedyGap = Math.round((TRUTH.remedy - TRUTH.placebo) * 100);
  return el('div', { class: 'decomp' },
    el('div', { class: 'decomp-bar' },
      el('div', { class: 'seg seg-natural', style: 'width:' + natural + '%' }, el('span', { text: natural + '%' })),
      el('div', { class: 'seg seg-placebo', style: 'width:' + placeboGap + '%' }, el('span', { text: '+' + placeboGap })),
      el('div', { class: 'seg seg-remedy', style: 'width:' + remedyGap + '%' }, el('span', { text: '+' + remedyGap }))),
    el('ul', { class: 'decomp-key' },
      el('li', {}, el('span', { class: 'key key-natural' }),
        el('strong', { text: natural + ' points — better anyway. ' }),
        'Natural recovery. These people needed nothing from anybody.'),
      el('li', {}, el('span', { class: 'key key-placebo' }),
        el('strong', { text: '+' + placeboGap + ' points — the placebo effect. ' }),
        'A real improvement produced by being treated: the pill, the ritual, the expectation, the attention. No ingredient involved.'),
      el('li', {}, el('span', { class: 'key key-remedy' }),
        el('strong', { text: '+' + remedyGap + ' points — the remedy itself. ' }),
        'What the active ingredient actually adds, once everything else is accounted for.')),
  );
}


// The closing statement: what the placebo effect is, and the named biases that
// make it so hard to see without a trial built to block them.
function summary() {
  const placeboGap = Math.round((TRUTH.placebo - TRUTH.natural) * 100);
  const line = (term, text) =>
    el('li', {}, el('strong', { class: 'sum-term', text: term }), el('span', { text: text }));
  return el('div', { class: 'summary' },
    el('h2', { class: 'summary-head', text: 'In summary' }),
    el('p', { class: 'summary-lede' },
      'The ', el('strong', { text: 'placebo effect' }),
      ' is a real change in how somebody feels or performs, produced by the ',
      el('strong', { text: 'expectation' }),
      ' of being treated rather than by anything in the treatment. Here it was worth ',
      el('strong', { text: placeboGap + ' points' }), ' — more than the remedy.'),
    el('p', {},
      'It is not itself a ', el('strong', { text: 'cognitive bias' }),
      ', but a genuine response to the context of treatment. Biases are what hide it:'),
    el('ul', { class: 'summary-list' },
      line('Confirmation bias', ' — round 3, marking generously in the direction you expected.'),
      line('Illusory correlation', ' — round 1, one thing after another read as cause and effect.'),
      line('Regression to the mean', ' — patients arrive at their worst, and worst is followed by better.'),
      line('Anchoring', ' — “14 of 20” set what a good result looked like.'),
      line('Authority bias', ' — a colleague’s word and a clinic both raise what patients expect.')),
    el('p', { class: 'summary-close' },
      'Each part of the trial blocks one of them. The control group blocks natural recovery and regression to the mean; the dummy pill separates expectation from ingredient; blinding stops confirmation bias marking the results; enough patients stop chance looking like an effect.'),
  );
}

function debriefScreen({ mount, session, onDone }) {
  const answers = session.rounds || [];
  const right = answers.filter((a) => a.right).length;
  const go = button('Continue', () => onDone());

  const node = panel({
    eyebrow: 'What the remedy actually does',
    title: 'Seventy per cent got better. Ten of it was the remedy.',
    lede: 'Here are the numbers every result in this game was generated from. You were never going to be able to see them directly — that is exactly why the study design mattered.',
    children: [
      el('div', { class: 'termstrip' },
        ['placebo effect', 'natural recovery', 'placebo response', 'control group'].map((t) =>
          el('span', { class: 'term', text: t })),
      ),
      decomposition(),
      el('div', { class: 'callout' },
        el('p', {}, el('strong', { text: 'This is the distinction worth keeping. ' }),
          'The whole 70 per cent is the ', el('strong', { text: 'placebo response' }),
          ' — everything that happens after a treatment, mixed together. The ',
          el('strong', { text: 'placebo effect' }),
          ' is only the middle band: the part that expectation is responsible for. You cannot separate them by watching one person get better. You can only separate them by comparison.')),

      summary(),

      el('div', { class: 'rule' }),
      el('h2', { class: 'beat-title', text: 'How you did' }),
      el('div', { class: 'stats' },
        stat('sound verdicts', right + ' of ' + answers.length),
        stat('the placebo effect', '+' + Math.round((TRUTH.placebo - TRUTH.natural) * 100) + ' points'),
        stat('the remedy', '+' + Math.round((TRUTH.remedy - TRUTH.placebo) * 100) + ' points')),
      el('ul', { class: 'scorelist' },
        ROUNDS.map((round) => {
          const answer = answers.find((a) => a.round === round.n);
          return el('li', { class: answer && answer.right ? 'ok' : 'miss' },
            el('span', { class: 'score-mark', text: answer && answer.right ? '✓' : '·' }),
            el('span', {}, el('strong', { text: 'Round ' + round.n + '. ' }), round.lesson.heading));
        })),

      el('div', { class: 'rule' }),
      el('details', { class: 'disclosure' },
        el('summary', { text: 'Every term this used, defined with examples (9)' }),
        glossarySection()),
    ],
    footer: go,
  });
  mount.replaceChildren(node);
  announce('The remedy adds ten points. The placebo effect adds twenty.');
  go.focus();
}

/* ---- src/data.js ---- */
// What happens to the record at the end. Nothing here sends anything anywhere.



function dataScreen({ mount, session, onRestart }) {
  const status = el('p', { class: 'data-status', role: 'status' });
  const raw = el('textarea', { class: 'raw-record', readonly: true, rows: '10', 'aria-label': 'Your session record' });
  raw.value = toJSON(session);

  const keep = button('Keep it in this browser', () => {
    session.disposition = 'kept';
    raw.value = toJSON(session);
    status.textContent = keepSession(session)
      ? 'Saved to this browser only. Clearing site data removes it.'
      : 'This browser refused local storage, so nothing was saved.';
  });
  const copy = button('Copy the record', async () => {
    try {
      await navigator.clipboard.writeText(raw.value);
      status.textContent = 'Copied to your clipboard.';
    } catch {
      raw.select();
      status.textContent = 'Clipboard blocked. The record is selected below — copy it with Cmd/Ctrl+C.';
    }
  }, { variant: 'quiet' });
  const download = button('Download as a file', async () => {
    status.textContent = 'Preparing the file…';
    const result = await downloadSession(session);
    status.textContent = result.saved
      ? 'Saved.'
      : result.code === 'declined'
        ? 'Not saved — you declined the prompt. Nothing changed.'
        : 'This viewer will not let the page save a file. Use "Copy the record" instead.';
  }, { variant: 'quiet' });
  const discard = button('Discard everything', () => {
    forgetSession();
    session.disposition = 'discarded';
    raw.value = '{ "discarded": true }';
    status.textContent = 'Discarded. Nothing about this session remains.';
  }, { variant: 'quiet' });
  const again = button('Run it all again', () => onRestart(), { variant: 'quiet' });

  downloadRoute().then((route) => {
    if (route.kind !== 'none') return;
    download.remove();
    status.textContent = 'Downloads are unavailable in this viewer, so the file button is gone. "Copy the record" gives you the same JSON.';
  });

  const truth = truthHash();
  const node = panel({
    eyebrow: 'Your data',
    title: 'It is still only yours',
    lede: 'There is no server behind this and no analytics: nothing about your session has been sent to anyone. Saving it puts a file on your own device, and closing the tab is also a complete answer.',
    children: [
      el('div', { class: 'data-actions' }, keep, copy, download, discard),
      status,
      el('details', { class: 'disclosure' }, el('summary', { text: 'Show me the whole record' }), raw),
      el('div', { class: 'rule' }),
      el('h2', { class: 'beat-title', text: 'If you want to check any of it' }),
      el('ul', { class: 'terms terms-tight' },
        el('li', {}, 'Every result you saw was sampled from four numbers, printed in full on the last screen. Their fingerprint: ',
          el('span', { class: 'mono', text: truth })),
        el('li', {}, el('span', { class: 'mono', text: 'npm test' }),
          ' runs thousands of simulated studies and checks that a well-designed one finds the remedy and a badly-designed one cannot.'),
        el('li', {}, 'Your studies came from the seed ', el('span', { class: 'mono', text: session.seed }),
          '. The same seed and the same designs give the same patients, every time.'),
      ),
      el('p', { class: 'muted', text: 'Thanks for running the studies.' }),
    ],
    footer: again,
  });
  mount.replaceChildren(node);
  announce('Session complete. Choose what happens to your data.');
}

/* ---- src/main.js ---- */
// Flow controller. Owns the session record and the order of screens; the model
// lives in src/trial.js and is never reached into from here.








const TOTAL_STEPS = ROUNDS.length + 3;

function start() {
  const mount = document.getElementById('app');
  const stepLabel = document.getElementById('step-label');
  const motionToggle = document.getElementById('motion-toggle');

  const seed = randomSeedString();
  const session = createSession(seed);

  let reducedMotion =
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  motionToggle.checked = reducedMotion;
  motionToggle.addEventListener('change', () => {
    reducedMotion = motionToggle.checked;
    session.device.reducedMotion = reducedMotion;
    log(session, 'reduced-motion', { on: reducedMotion });
    announce(reducedMotion ? 'Reduced motion on.' : 'Reduced motion off.');
  });
  session.device = { ...session.device, ...describeDevice(), reducedMotion };

  function show(index, label, render) {
    stepLabel.textContent = index + ' / ' + TOTAL_STEPS + ' · ' + label;
    window.scrollTo({ top: 0, behavior: 'auto' });
    render(mount);
  }

  function toIntro() {
    show(1, 'The remedy', (m) =>
      introScreen({
        mount: m,
        onDone: () => {
          log(session, 'start', { version: session.consentVersion });
          toRound(1);
        },
      }),
    );
  }

  function toRound(n) {
    show(1 + n, 'Round ' + n, (m) =>
      roundScreen({
        mount: m,
        round: roundByNumber(n),
        seed,
        reducedMotion,
        onDone: (result) => {
          session.rounds.push(result);
          log(session, 'round', result);
          if (n < ROUNDS.length) toRound(n + 1);
          else toDebrief();
        },
      }),
    );
  }

  function toDebrief() {
    show(TOTAL_STEPS - 1, 'The answer', (m) =>
      debriefScreen({
        mount: m,
        session,
        onDone: () => {
          log(session, 'debrief-seen', {});
          toData();
        },
      }),
    );
  }

  function toData() {
    session.completedAt = new Date().toISOString();
    show(TOTAL_STEPS, 'Your data', (m) =>
      dataScreen({ mount: m, session, onRestart: () => window.location.reload() }),
    );
  }

  toIntro();

  // Returned so a test - or anyone auditing a live page from the console - can
  // read the session without waiting for it to end.
  return session;
}

start();
})();
